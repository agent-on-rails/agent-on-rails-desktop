name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-windows-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Import Windows certificate
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${WINDOWS_CERTIFICATE:-}" ]; then
            echo "WINDOWS_CERTIFICATE missing — building unsigned MSI/NSIS"
            exit 0
          fi
          echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
          echo "CERT_PATH=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
          echo "Windows certificate imported"

      - name: Build Windows bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CSC_LINK: ${{ env.CERT_PATH }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          npm run tauri build -- --bundles msi,nsis
          mkdir -p dist-release
          find src-tauri/target/release/bundle -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.sig' \) -print -exec cp -f {} dist-release/ \;
          ls -la dist-release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist-release/**
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-windows-v0.1.0-${{ github.run_number }}
          name: Agent On Rails Setup Windows 0.1.0 (CI #${{ github.run_number }})
          body: |
            Windows MSI/NSIS from GitHub Actions (`windows-latest`).
            Unsigned if `WINDOWS_CERTIFICATE` secret is not configured.
          prerelease: true
          files: dist-release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
